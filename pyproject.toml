[project]
name = "Orca"
version = "0.3.0"
description = "Orca is a modern data warehouse implementation built with best-in-class open-source tools."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  "dagster>=1.12.14",  # Orchestration framework
  "dagster-dbt>=0.25.14",  # Dagster dbt integration
  "dagster-dlt>=0.29.8",  # Dagster dlt integration
  "dagster-duckdb>=0.29.17",  # DuckDB resource for Dagster
  "dagster-malloy>=0.2.6",  # Dagster Malloy integration
  "dagster-webserver>=1.12.14",  # Dagster web UI
  "dbt-duckdb>=1.9.0",  # dbt DuckDB adapter
  "dlt[duckdb,hub]>=1.29.0",  # Data ingestion
  "duckdb>=1.4.2",  # Analytical database
]

[dependency-groups]
dev = [
  "dagster-dg-cli>=1.12.14",  # Dagster CLI
  "ipykernel>=7.2.0",  # Jupyter kernel for interactive development
  "jupytext>=1.19.1",  # Jupyter notebook and script synchronization
  "notebook>=7.5.3",  # Jupyter notebook interface
  "pyyaml>=6.0.3",  # Required for skill-creator scripts
  "ruff>=0.8.0",  # Python linter and formatter
]

analytics = [
  "altair>=6.0.0",  # Plotting library
  "duckdb-cli>=1.5.0",  # DuckDB CLI
  "marimo>=0.23.8",  # Notebook-style data analysis
  "pandas>=2.3.3",  # DataFrame manipulation library
  "plotly>=6.5.2",  # Plotting library
  "polars>=1.35.2",  # DataFrame manipulation library
  "pyarrow>=22.0.0",  # Columnar in-memory format (used by dlt for performance)
  "streamlit>=1.54.0",  # Python web data app
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "orchestration"]

[tool.ruff]
fix = true
unsafe-fixes = true

# Exclude external skills formatting.
extend-exclude = [".agents/skills/*"]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
preview = true
# Comprehensive but pragmatic base categories for data engineering
extend-select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "I",  # isort
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM",  # flake8-simplify
  "A",  # flake8-builtins
  "RET",  # flake8-return
  "PT",  # flake8-pytest-style
  "N",  # pep8-naming
  "RUF",  # Ruff-specific rules
  "S",  # flake8-bandit (security)
  "T20",  # flake8-print (enforce logging in production pipelines)
  "PLC",  # pylint convention
  "PLE",  # pylint error
  "PD",  # pandas best practices
  "NPY",  # numpy best practices
  "FA",  # flake8-future-annotations
  "ICN",  # flake8-import-conventions (standard pd, pl, pa, st aliases)
  "PTH",  # flake8-use-pathlib
  "PERF",  # Perflint (performance checks)
  "FURB",  # refurb (modern python idioms)
  "PIE",  # flake8-pie
  "SLF",  # flake8-self
  "TC",  # flake8-type-checking (move type-only imports to IF TYPE_CHECKING)
  "G",  # flake8-logging-format (enforces lazy logging formatting)
  "LOG",  # flake8-logging
]

# Globally ignored for friction-less data development
ignore = [
  "hardcoded-sql-expression",  # Allow hardcoded SQL
  "assert",  # Allow assert
  "zip-without-explicit-strict",  # Allow zip() without strict argument
  "ambiguous-unicode-character-string",  # Allow ambiguous unicode string
  "ambiguous-unicode-character-docstring",  # Allow ambiguous unicode docstring
  "ambiguous-unicode-character-comment",  # Allow ambiguous unicode comment
  "unnecessary-assign",  # Allow variable assignment before return
  "magic-value-comparison",  # Allow magic numbers in data thresholds & batch sizes
  "too-many-arguments",  # Allow functions with multiple arguments
  "too-many-locals",  # Allow functions with multiple local variables
  "suspicious-non-cryptographic-random-usage",  # Allow standard random for data sampling
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["dlt.sources.incremental"]

[tool.ruff.lint.flake8-import-conventions.aliases]
altair = "alt"
dagster = "dg"
dlt = "dlt"
duckdb = "duckdb"
numpy = "np"
pandas = "pd"
polars = "pl"
pyarrow = "pa"
streamlit = "st"

[tool.ruff.lint.pycodestyle]
max-line-length = 320

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Relaxed rules for data science, modeling, dashboards, and notebooks
"analytics/**" = [
  "print",  # Allow print statements (T20)
  "invalid-argument-name",  # Allow uppercase arguments (e.g., matrix X) (N)
  "non-lowercase-variable-in-function",  # Allow uppercase variables in functions (N)
  "module-import-not-at-top-of-file",  # Allow imports not at top of file (common in notebooks) (E)
  "request-without-timeout",  # Allow requests without timeouts for quick scraping (S)
  "G",  # Allow f-strings in logging for interactive dashboard/EDA code
  "LOG",  # Allow non-lazy logging in analytics
]
"**/*.ipynb" = [
  "print",  # Allow print in notebooks
  "module-import-not-at-top-of-file",  # Allow delayed imports
  "G",  # Allow f-strings in logging in notebooks
  "LOG",  # Allow non-lazy logging in notebooks
]
