[project]
name = "Orca"
version = "0.4.0"
description = "Orca is a modern data warehouse implementation built with best-in-class open-source tools."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  # Ingestion
  "dlt[ducklake]>=1.29.0",  # Data ingestion

  # Transformation
  "dbt-duckdb>=1.9.0",  # dbt DuckDB adapter

  # Orchestration
  "dagster>=1.12.14",  # Orchestration framework
  "dagster-dbt>=0.25.14",  # Dagster dbt integration
  "dagster-dg-cli>=1.12.14",  # Dagster CLI
  "dagster-dlt>=0.29.8",  # Dagster dlt integration

  # Storage & Compute
  "duckdb>=1.4.2,<2",  # Analytical database
  "duckdb-cli>=1.5.0,<2",  # DuckDB CLI

  # Analytics & Reporting
  "boring-semantic-layer>=0.3.18",  # Semantic layer
  "ibis-framework[duckdb]>=11.0.0",  # Ibis DuckDB backend (required by BSL)
  "marimo>=0.23.8",  # Notebook-style data analysis
  "pandas>=2.3.3",  # DataFrame manipulation library
  "polars>=1.35.2",  # DataFrame manipulation library
  "pyarrow>=22.0.0",  # Columnar format (used by dlt, DuckDB, Polars & Streamlit)
  "streamlit>=1.54.0",  # Python web data app
]

[dependency-groups]
# Dagster UI webserver deployment
deployment = [
  "dagster>=1.12.14",  # Orchestration framework
  "dagster-dbt>=0.25.14",  # Dagster dbt integration
  "dagster-dlt>=0.29.8",  # Dagster dlt integration
  "dagster-webserver>=1.12.14",  # Dagster web UI
  "dbt-duckdb>=1.9.0",  # dbt DuckDB adapter
  "duckdb>=1.4.2,<2",  # Analytical database
]

# Dedicated for github actions dbt-docs build
dbt-docs = [
  "dbt-duckdb>=1.9.0",  # dbt DuckDB adapter
  "duckdb>=1.4.2,<2",  # Analytical database
]

# Developer environment
dev = [
  "dagster-webserver>=1.12.14",  # Dagster web UI
  "ipykernel>=7.2.0",  # Jupyter kernel for interactive development
  "jupytext>=1.19.1",  # Jupyter notebook and script synchronization
  "notebook>=7.5.3",  # Jupyter notebook interface
  "pyyaml>=6.0.3",  # Required for skill-creator scripts
  "ruff>=0.8.0",  # Python linter and formatter
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"

[tool.hatch.build.targets.wheel]
packages = ["analytics", "ingestion", "orchestration"]

[tool.ruff]
fix = true
unsafe-fixes = true

# Exclude external skills formatting.
extend-exclude = [".agents/skills/*"]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
preview = true
extend-select = [
  "A",  # flake8-builtins
  "ICN",  # flake8-import-conventions (standard pd, pl, pa, st aliases)
  "NPY",  # numpy best practices
  "PD",  # pandas best practices
  "SLF",  # flake8-self
  "T20",  # flake8-print (enforce logging in production pipelines)
]

# Ignored for data development
ignore = [
  "hardcoded-sql-expression",
  "assert",
  "zip-without-explicit-strict",
  "ambiguous-unicode-character-string",
  "ambiguous-unicode-character-docstring",
  "ambiguous-unicode-character-comment",
  "unnecessary-assign",
  "magic-value-comparison",
  "too-many-arguments",
  "too-many-locals",
  "suspicious-non-cryptographic-random-usage",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["dlt.sources.incremental"]

[tool.ruff.lint.flake8-import-conventions.aliases]
dagster = "dg"
dlt = "dlt"
duckdb = "duckdb"
numpy = "np"
pandas = "pd"
polars = "pl"
pyarrow = "pa"
streamlit = "st"

[tool.ruff.lint.pycodestyle]
max-line-length = 320

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Relaxed rules for data science, modeling, dashboards, and notebooks
"analytics/**" = [
  "print",
  "invalid-argument-name",
  "non-lowercase-variable-in-function",
  "module-import-not-at-top-of-file",
  "request-without-timeout",
  "G",  # Allow f-strings in logging
  "LOG",  # Allow non-lazy logging
]
"**/*.ipynb" = [
  "print",  # Allow print in notebooks
  "module-import-not-at-top-of-file",  # Allow delayed imports
  "G",  # Allow f-strings in logging in notebooks
  "LOG",  # Allow non-lazy logging in notebooks
]
