<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orca Data Warehouse – Démarrage de l'instance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.8s ease-out;
    }
    .logo-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(14, 165, 233, 0.4);
    }
    .logo svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .spinner-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 32px auto;
    }
    .spinner {
      width: 100%;
      height: 100%;
      border: 4px solid rgba(14, 165, 233, 0.15);
      border-top: 4px solid #0ea5e9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .timer {
      font-size: 0.85rem;
      color: #64748b;
      font-variant-numeric: tabular-nums;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
    </div>
    
    <div class="status-badge">
      <div class="pulse-dot"></div>
      <span>Instance Serverless GCP</span>
    </div>

    <h1>Démarrage de Dagster UI...</h1>
    <p>L'instance serverless s'éveille pour économiser vos ressources. Redirection automatique dès que le serveur est prêt.</p>

    <div class="spinner-wrapper">
      <div class="spinner"></div>
    </div>

    <div class="timer" id="timer">Temps écoulé : 0s</div>
  </div>

  <script>
    const TARGET_URL = 'https://orca-dagster-iaggoalhda-uc.a.run.app/orchestration/';
    const POLL_INTERVAL_MS = 1000; // 1 seconde polling interval
    
    let secondsElapsed = 0;
    const timerElem = document.getElementById('timer');

    // Counter timer
    setInterval(() => {
      secondsElapsed++;
      timerElem.textContent = `Temps écoulé : ${secondsElapsed}s`;
    }, 1000);

    // Poll endpoint every 1 second
    async function checkAvailability() {
      try {
        const response = await fetch(TARGET_URL, { method: 'HEAD', mode: 'no-cors' });
        // In no-cors mode, type 'opaque' indicates successful connection
        if (response) {
          window.location.href = TARGET_URL;
        }
      } catch (err) {
        // Server not ready yet, continue polling
      }
    }

    setInterval(checkAvailability, POLL_INTERVAL_MS);
    checkAvailability(); // Initial check
  </script>
</body>
</html>
