name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'deployment/**'
      - 'orchestration/**'
      - 'analytics/**'
      - '.github/workflows/deploy_cloud_run.yml'
  workflow_dispatch:

jobs:
  deploy-dagster:
    name: Deploy Dagster Web UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Artifact Registry repository if not exists
        run: |
          gcloud artifacts repositories create orca \
            --repository-format=docker \
            --location=us-central1 \
            --description="Orca data warehouse containers" --quiet || true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.dagster
          push: true
          tags: us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/orca/orca-dagster:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy orca-dagster to Cloud Run
        run: |
          gcloud run deploy orca-dagster \
            --image us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/orca/orca-dagster:latest \
            --region us-central1 \
            --no-allow-unauthenticated \
            --ingress all \
            --memory 1Gi \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 80 \
            --cpu-throttling
