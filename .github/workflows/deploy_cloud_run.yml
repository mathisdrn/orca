name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'deployment/**'
      - 'orchestration/**'
      - 'analytics/**'
      - '.github/workflows/deploy_cloud_run.yml'
  workflow_dispatch:

jobs:
  deploy-dagster:
    name: Deploy Dagster Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Artifact Registry repository if not exists
        run: |
          gcloud artifacts repositories create orca \
            --repository-format=docker \
            --location=us-central1 \
            --description="Orca data warehouse containers" --quiet || true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/orca/orca-dagster:latest -f deployment/Dockerfile.dagster .
          docker push us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/orca/orca-dagster:latest

      - name: Deploy orca-dagster to Cloud Run
        run: |
          gcloud run deploy orca-dagster \
            --image us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/orca/orca-dagster:latest \
            --region us-central1 \
            --no-allow-unauthenticated \
            --ingress all \
            --memory 1Gi \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 80 \
            --cpu-throttling
